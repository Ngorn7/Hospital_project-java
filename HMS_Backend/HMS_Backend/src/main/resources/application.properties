spring.application.name=hms
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/HMS_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
